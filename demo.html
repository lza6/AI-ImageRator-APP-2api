<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI ImageRator 2API · Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0b0d12; color: #e6e8ee; min-height: 100vh; padding: 24px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: .3px; }
  h1 span { color: #7c5cff; }
  .sub { color: #7b8090; font-size: 13px; margin-top: 6px; }
  .panel {
    background: #141824; border: 1px solid #232838; border-radius: 14px;
    padding: 20px; margin-bottom: 18px;
  }
  label { display: block; font-size: 12px; color: #9aa1b2; margin-bottom: 6px; letter-spacing: .4px; }
  textarea, input, select {
    width: 100%; background: #0e1119; border: 1px solid #262c3d; color: #e6e8ee;
    border-radius: 9px; padding: 11px 13px; font-size: 14px; font-family: inherit;
    outline: none; transition: border-color .15s;
  }
  textarea:focus, input:focus, select:focus { border-color: #7c5cff; }
  textarea { resize: vertical; min-height: 84px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
  .row2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 14px; }
  @media (max-width: 760px) { .row, .row2 { grid-template-columns: 1fr; } }
  button {
    width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 10px;
    background: linear-gradient(135deg, #7c5cff, #a855f7); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status {
    margin-top: 14px; font-size: 13px; padding: 11px 13px; border-radius: 9px;
    background: #0e1119; border: 1px solid #262c3d; color: #9aa1b2;
    font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all;
  }
  .status.ok { border-color: #1d6b4a; color: #4ade80; }
  .status.err { border-color: #7a2331; color: #f87171; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0e1119; border: 1px solid #232838; border-radius: 12px; overflow: hidden; }
  .card img { width: 100%; display: block; }
  .card .meta { padding: 9px 11px; font-size: 11px; color: #737a8c; font-family: ui-monospace, monospace; }
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #1a1f2e; color: #9aa1b2; margin-right: 6px;
  }
  .badge.warn { background: #2a2110; color: #fbbf24; }
  a { color: #7c5cff; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI ImageRator <span>2API</span> · Demo</h1>
    <div class="sub">
      上游 <code>image.pollinations.ai</code> · 免鉴权 · 匿名额度约 1 次 / 20 秒 / IP
      <span class="badge warn">串行闸已启用</span>
    </div>
  </header>

  <div class="panel">
    <label>提示词 Prompt</label>
    <textarea id="prompt">a golden retriever puppy sitting on lush green grass, soft natural light, shallow depth of field</textarea>

    <div class="row">
      <div>
        <label>模型 Model</label>
        <select id="model"></select>
      </div>
      <div>
        <label>尺寸 Size</label>
        <select id="size">
          <option value="1024x1024">1024 × 1024</option>
          <option value="768x768">768 × 768</option>
          <option value="512x512">512 × 512</option>
          <option value="768x1344">768 × 1344 (竖)</option>
          <option value="1344x768">1344 × 768 (横)</option>
        </select>
      </div>
      <div>
        <label>数量 n</label>
        <select id="n">
          <option>1</option><option>2</option><option>3</option><option>4</option>
        </select>
      </div>
      <div>
        <label>种子 Seed（可空）</label>
        <input id="seed" placeholder="随机">
      </div>
    </div>

    <div class="row2">
      <div>
        <label>水印处理</label>
        <select id="removeWm">
          <option value="false">保留水印（上游原图）</option>
          <option value="true">本地去除水印（inpaint / clone）</option>
        </select>
      </div>
      <div>
        <label>&nbsp;</label>
        <div style="font-size:11px;color:#737a8c;padding:11px 2px;line-height:1.5">
          水印由 pollinations <b>服务端</b>烙入，<code>nologo</code> 参数已失效，只能本地处理
        </div>
      </div>
    </div>

    <button id="go">生成图片</button>
    <div class="status" id="status">就绪</div>
    <div class="grid" id="out"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');

function setStatus(msg, cls) {
  statusEl.textContent = msg;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

async function loadModels() {
  try {
    const r = await fetch('/v1/models');
    const d = await r.json();
    const sel = $('model');
    sel.innerHTML = '';
    const seen = new Set();
    for (const m of d.data) {
      if (seen.has(m.upstream)) continue;
      seen.add(m.upstream);
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = `${m.id}  →  ${m.upstream}`;
      sel.appendChild(o);
    }
  } catch (e) {
    setStatus('模型列表加载失败: ' + e, 'err');
  }
}

$('go').onclick = async () => {
  const prompt = $('prompt').value.trim();
  if (!prompt) { setStatus('请输入提示词', 'err'); return; }

  $('go').disabled = true;
  $('out').innerHTML = '';
  const t0 = Date.now();
  setStatus('生成中…（匿名额度约 20 秒/张，请耐心等待）');

  try {
    const body = {
      prompt,
      model: $('model').value,
      size: $('size').value,
      n: parseInt($('n').value, 10),
      remove_watermark: $('removeWm').value === 'true',
    };
    if (body.remove_watermark) setStatus('生成中…（含水印处理，稍慢一点）');
    const sd = $('seed').value.trim();
    if (sd) body.seed = parseInt(sd, 10);

    const r = await fetch('/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();

    if (!r.ok) {
      setStatus('失败: ' + JSON.stringify(d.error || d), 'err');
      return;
    }

    for (const item of d.data) {
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = 'data:image/jpeg;base64,' + item.b64_json;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `${item._meta.model} · seed ${item._meta.seed} · ${item._meta.attempts} 次尝试`
        + (item._meta.watermark_removed ? ` · 已去水印(${item._meta.watermark_method})` : '');
      card.appendChild(img);
      card.appendChild(meta);
      $('out').appendChild(card);
    }
    setStatus(`完成 ${d.data.length} 张 · 耗时 ${((Date.now() - t0) / 1000).toFixed(1)}s`, 'ok');
  } catch (e) {
    setStatus('请求异常: ' + e, 'err');
  } finally {
    $('go').disabled = false;
  }
};

loadModels();
fetch('/stats').then(r => r.json()).then(s => {
  if (s.requests) setStatus(`历史：${s.requests} 请求 / ${s.success} 成功 / ${s.failed} 失败`);
}).catch(() => {});
</script>
</body>
</html>
